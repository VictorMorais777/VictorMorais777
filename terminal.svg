<svg width="680" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="300" rx="10" fill="#0d0d0d"/>
  
  <!-- Barra do terminal -->
  <rect width="680" height="32" rx="10" fill="#1a1a1a"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="21" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">~/joao-victor</text>

  <style>
    .line { font-family: 'Courier New', monospace; font-size: 14px; fill: #00ff00; }
    .cmd  { fill: #00ff00; }
    .out  { fill: #00cc00; }
    .cursor { fill: #00ff00; animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .l1  { animation: appear 0.1s 0.5s both; }
    .l2  { animation: appear 0.1s 1.0s both; }
    .l3  { animation: appear 0.1s 1.8s both; }
    .l4  { animation: appear 0.1s 2.3s both; }
    .l5  { animation: appear 0.1s 3.1s both; }
    .l6  { animation: appear 0.1s 3.6s both; }
    .l7  { animation: appear 0.1s 4.1s both; }
    .l8  { animation: appear 0.1s 4.6s both; }
    .l9  { animation: appear 0.1s 5.4s both; }
    .l10 { animation: appear 0.1s 5.9s both; }
    .l11 { animation: appear 0.1s 6.4s both; }
    @keyframes appear { from{opacity:0} to{opacity:1} }
  </style>

  <text x="20" y="65"  class="line cmd l1">$ whoami</text>
  <text x="20" y="85"  class="line out l2">> João Victor da Silva Morais</text>

  <text x="20" y="115" class="line cmd l3">$ cat perfil.txt</text>
  <text x="20" y="135" class="line out l4">> Engenharia de Software @ UMC — 6° semestre</text>
  <text x="20" y="155" class="line out l5">> Desenvolvedor Freelancer | Estágio / Júnior</text>
  <text x="20" y="175" class="line out l6">> Java · Spring Boot · React · Next.js · MySQL</text>

  <text x="20" y="205" class="line cmd l7">$ git status</text>
  <text x="20" y="225" class="line out l8">> Sempre aprendendo... ✓</text>
  <text x="20" y="245" class="line out l9">> Aberto a oportunidades... ✓</text>

  <text x="20" y="275" class="line cmd l10">$ _</text>
  <rect x="20" y="261" width="8" height="16" class="cursor l11"/>
</svg>
